# CI gate for peer files. Runs on pull_request_target so the workflow comes
# from main, never from the PR: a PR can't change the check that judges it.
# The PR is checked out only as data (YAML is parsed, nothing from it runs).
name: check

on:
  # zizmor flags pull_request_target as dangerous: it runs with the base
  # repo's token and secrets. That is the point here (a PR must not be able to
  # change the gate that judges it), and it is safe because nothing from the
  # PR is executed: its files are only parsed as YAML by a pinned peercheck,
  # the checkout keeps no credentials, and no step interpolates PR fields
  # into a shell.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

permissions: {}

# Cancel superseded runs; the latest push is the one that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # dn42-operator release providing cmd/peercheck. Pinned; bump with Renovate.
  # NOTE: resolves only once github.com/oscrx/dn42-operator is public and tagged.
  PEERCHECK_VERSION: v0.1.0
  # Login of the autopeer GitHub App's bot user.
  APP_LOGIN: dn42-autopeer[bot]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      auto-mergeable: ${{ steps.check.outputs.auto-mergeable }}
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Install peercheck
        run: go install "github.com/oscrx/dn42-operator/cmd/peercheck@${PEERCHECK_VERSION}"

      # git.dn42.dev needs an account: DN42_REGISTRY_TOKEN is a read-only
      # access token of Oscar's registry account. Without it, the gate falls
      # back to registry/asns.txt in main (refreshed by hand) -- never to
      # skipping the check.
      - name: Fetch the DN42 registry (aut-num objects only)
        env:
          DN42_REGISTRY_TOKEN: ${{ secrets.DN42_REGISTRY_TOKEN }}
        run: |
          if [ -n "$DN42_REGISTRY_TOKEN" ]; then
            git -c "http.extraHeader=Authorization: token ${DN42_REGISTRY_TOKEN}" clone --quiet --depth 1 \
              --filter=blob:none --sparse https://git.dn42.dev/dn42/registry.git registry
            git -C registry sparse-checkout set data/aut-num
            echo "REGISTRY_ARGS=--registry-dir registry" >> "$GITHUB_ENV"
          else
            echo "::warning::DN42_REGISTRY_TOKEN not set, using the committed ASN list"
            echo "REGISTRY_ARGS=--asn-list base/registry/asns.txt" >> "$GITHUB_ENV"
          fi

      # The committed ASN list from main (never from the PR).
      - name: Check out main for the ASN list
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: base
          sparse-checkout: registry
          persist-credentials: false

      - name: Check out the change as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Check
        id: check
        env:
          EVENT: ${{ github.event_name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$EVENT" = pull_request_target ]; then
            git -C pr fetch --quiet --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" "+refs/heads/main:refs/remotes/base/main"
            peercheck --repo pr --base base/main --author "$AUTHOR" --app-login "$APP_LOGIN" $REGISTRY_ARGS
          else
            peercheck --repo pr $REGISTRY_ARGS
          fi

  # Only PRs from the App that change exactly one peer file, with the check
  # green, get auto-merge enabled; everything else waits for a human.
  auto-merge:
    needs: check
    if: github.event_name == 'pull_request_target' && needs.check.outputs.auto-mergeable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$HEAD_SHA"
