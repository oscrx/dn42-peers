# CI gate for peer files. Runs on pull_request_target so the workflow comes
# from main, never from the PR: a PR can't change the check that judges it.
# The PR is checked out only as data (YAML is parsed, nothing from it runs).
name: check

on:
  # zizmor flags pull_request_target as dangerous: it runs with the base
  # repo's token and secrets. That is the point here (a PR must not be able to
  # change the gate that judges it), and it is safe because nothing from the
  # PR is executed: its files are only parsed as YAML by a pinned peercheck,
  # the checkout keeps no credentials, and no step interpolates PR fields
  # into a shell.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]
  # Merges made by the auto-merge job (GITHUB_TOKEN) don't trigger the push
  # run above, so check the whole tree on main once a day as well.
  schedule:
    - cron: "17 4 * * *"

permissions: {}

# Cancel superseded runs; the latest push is the one that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # dn42-operator release providing cmd/peercheck. Pinned; bump with Renovate.
  PEERCHECK_VERSION: v0.3.12
  # Login of the autopeer GitHub App's bot user.
  APP_LOGIN: dn42-autopeer[bot]
  # Our own ASN: a peer file with it would be iBGP, not a peering.
  LOCAL_ASN: "4242423818"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      auto-mergeable: ${{ steps.check.outputs.auto-mergeable }}
    steps:
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
          cache: false

      - name: Install peercheck
        run: go install "github.com/oscrx/dn42-operator/cmd/peercheck@${PEERCHECK_VERSION}"

      # git.dn42.dev needs an account: DN42_REGISTRY_TOKEN is a read-only
      # access token of Oscar's registry account. Without it, the gate falls
      # back to registry/asns.txt in main (refreshed by hand) -- never to
      # skipping the check.
      # peercheck only asks whether data/aut-num/AS<n> exists, so a file
      # listing is enough: a tree-only clone fetches the commit, and ls-tree
      # then lazily fetches just the three trees on the path (no blobs, no
      # other directories), a few hundred KB instead of the aut-num objects.
      - name: List the DN42 registry's aut-num objects
        env:
          DN42_REGISTRY_TOKEN: ${{ secrets.DN42_REGISTRY_TOKEN }}
        run: |
          if [ -n "$DN42_REGISTRY_TOKEN" ]; then
            auth="http.extraHeader=Authorization: token ${DN42_REGISTRY_TOKEN}"
            git -c "$auth" clone --quiet --depth 1 --filter=tree:0 --no-checkout \
              https://git.dn42.dev/dn42/registry.git registry
            # The lazy tree fetch needs the header too (it isn't stored in
            # the clone's config).
            git -c "$auth" -C registry ls-tree --name-only HEAD:data/aut-num/ > asns.txt
            # An empty or tiny list means the fetch went wrong, not that
            # every ASN is gone: fail rather than reject every peer.
            n=$(grep -c '^AS' asns.txt || true)
            if [ "$n" -lt 1000 ]; then
              echo "::error::only $n aut-num objects listed"
              exit 1
            fi
            echo "$n aut-num objects"
            echo "REGISTRY_ARGS=--asn-list asns.txt" >> "$GITHUB_ENV"
          else
            echo "::warning::DN42_REGISTRY_TOKEN not set, using the committed ASN list"
            echo "REGISTRY_ARGS=--asn-list base/registry/asns.txt" >> "$GITHUB_ENV"
          fi

      # The committed ASN list from main (never from the PR).
      - name: Check out main for the ASN list
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: base
          sparse-checkout: registry
          persist-credentials: false

      - name: Check out the change as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge result, not the PR head: duplicate ports or names with
          # something merged since the PR was opened only show up there. A PR
          # that conflicts with main has no merge ref, so it fails here.
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Check
        id: check
        env:
          EVENT: ${{ github.event_name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request_target ]; then
            # GitHub updates the merge ref asynchronously: make sure it is
            # built from the head this run is for, since auto-merge merges
            # exactly that commit (--match-head-commit).
            merged=$(git -C pr rev-parse HEAD^2)
            if [ "$merged" != "$HEAD_SHA" ]; then
              echo "::error::the merge ref is for $merged, not the PR head $HEAD_SHA; re-run once GitHub has updated it"
              exit 1
            fi
            git -C pr fetch --quiet --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" "+refs/heads/main:refs/remotes/base/main"
            peercheck --repo pr --base base/main --author "$AUTHOR" --app-login "$APP_LOGIN" --local-asn "$LOCAL_ASN" $REGISTRY_ARGS
          else
            peercheck --repo pr --local-asn "$LOCAL_ASN" $REGISTRY_ARGS
          fi

  # Only PRs from the App that change exactly one peer file, with the check
  # green, get auto-merge enabled; everything else waits for a human.
  auto-merge:
    needs: check
    if: github.event_name == 'pull_request_target' && needs.check.outputs.auto-mergeable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The required check has passed by now, so the PR is usually mergeable
      # already, and GitHub refuses to enable auto-merge on a mergeable PR
      # ("clean status", or "unstable status" while this job's own check is
      # still running). Then merge it directly: the rulesets still apply, and
      # --match-head-commit pins the commit the check saw.
      - name: Auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if out=$(gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$HEAD_SHA" 2>&1); then
            echo "$out"
            exit 0
          fi
          echo "$out"
          case "$out" in
            *"clean status"*|*"unstable status"*) ;;
            *) exit 1 ;;
          esac
          echo "The PR is mergeable already: merging it directly."
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD_SHA"
